# docker compose up --build        -> PostgreSQL + API + dashboard on http://localhost:8000
# docker compose --profile mqtt up -> also Mosquitto + MQTT bridge
# docker compose --profile monitoring up -> also Prometheus on :9090
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hcf
      POSTGRES_USER: hcf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcf -d hcf"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://hcf:${POSTGRES_PASSWORD}@postgres:5432/hcf
      RUNTIME_DIR: /app/runtime
      CORS_ORIGINS: http://localhost:8000
    ports: ["8000:8000"]
    volumes: [runtime:/app/runtime]
    depends_on:
      postgres: {condition: service_healthy}

  mosquitto:
    image: eclipse-mosquitto:2
    profiles: [mqtt]
    ports: ["1883:1883"]
    volumes: [./monitoring/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro]

  mqtt-bridge:
    build: .
    profiles: [mqtt]
    env_file: .env
    environment: {API_URL: "http://api:8000", MQTT_HOST: mosquitto}
    command: ["sh", "-c", "pip install --user paho-mqtt==2.1.0 && python -m scripts.mqtt_bridge"]
    depends_on: [api, mosquitto]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    ports: ["9090:9090"]
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    depends_on: [api]

volumes:
  pgdata:
  runtime:
