name: CI
on:
  push: {branches: [main, develop, "feature/**"]}
  pull_request: {branches: [main, develop]}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install ruff==0.16.9
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Unit + integration tests (SQLite, real committed model artifacts)
        run: pytest -q --junitxml=results/tests/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: junit, path: results/tests/junit.xml}

  postgres:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: hcf, POSTGRES_USER: hcf, POSTGRES_PASSWORD: ci-only-password}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hcf" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://hcf:ci-only-password@localhost:5432/hcf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Migrations on PostgreSQL (upgrade, drift check, downgrade, upgrade)
        run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - name: Pipeline smoke test on PostgreSQL
        run: python -m scripts.smoke_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hcf-api:ci .
